    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- The whole site is set in these two. Instrument Sans carries every
         heading, every body line and every control; Google Sans takes the
         small text — labels, indices, captions, tags.

         Loaded as a <link> rather than an @import so they download alongside
         the bundle instead of queueing behind it. Instrument Sans is a
         variable face, so 400-700 arrives in one ~30KB latin file; Google
         Sans is three static weights at ~36KB each.

         Note Instrument Sans tops out at 700 — there is no 900 master, so
         anything that asked for Black now asks for Bold instead rather than
         letting the browser synthesise one.

         Archivo is the one exception to those two, and carries a single word:
         the wordmark in the hero. It is loaded at width 125 / weight 900,
         which is the closest face I can actually serve to the wide, heavy
         display type in the reference. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Google+Sans:wght@400;500;700&family=Archivo:wdth,wght@125,900&display=swap">
    <title>Michael Gaitho</title>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
